# Training configuration
model:
  name: "sports_injury_predictor"
  version: "1.0.0"
  type: "xgboost"              # Options: xgboost | lightgbm | random_forest | logistic_regression

# XGBoost hyperparameters
xgboost:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 3          # Handles class imbalance (injured/not)
  eval_metric: "aucpr"
  random_state: 42

# LightGBM hyperparameters
lightgbm:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  num_leaves: 63
  class_weight: "balanced"
  random_state: 42

# Data split
data:
  test_size: 0.2
  validation_size: 0.1
  random_state: 42
  stratify: true

# Cross-validation
cv:
  n_splits: 5
  strategy: "stratified_kfold"

# Feature engineering
features:
  rolling_window_days: [7, 14, 28]   # ACWR calculation windows
  drop_columns:
    - "athlete_id"
    - "date"

# Paths (overridden by .env if set)
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  artifacts: "model/artifacts"

# MLflow
mlflow:
  experiment_name: "sports-injury-predictor"
  run_name: "xgboost-baseline"
